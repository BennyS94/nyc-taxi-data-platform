version: 2

models:
  - name: dim_zone
    description: >-
      Taxi Zone dimension at one row per TLC location plus the key-zero Unknown member.
      The stable TLC location ID is reused as the known zone key; this one dimension
      serves both pickup and dropoff roles.
    columns:
      - name: zone_key
        description: Location ID for known zones and zero for Unknown.
        data_tests:
          - not_null
          - unique
      - name: location_id
        description: TLC LocationID; null only for the Unknown member.
        data_tests:
          - unique
      - name: borough
        description: Source borough, or Unknown for the fallback member.
      - name: zone_name
        description: Source zone name, or Unknown for the fallback member.
      - name: service_zone
        description: Source service zone; null for the fallback member when unavailable.

  - name: dim_vendor
    description: >-
      Current TLC vendor mapping at one row per documented vendor plus the key-zero
      Unknown member. Vendor IDs are stable known keys and no history is tracked.
    columns:
      - name: vendor_key
        description: TLC vendor ID for known vendors and zero for Unknown.
        data_tests:
          - not_null
          - unique
      - name: vendor_id
        description: TLC vendor code; null for the Unknown member.
      - name: vendor_name
        description: TLC-documented provider name or Unknown.

  - name: dim_date
    description: >-
      Calendar dimension over distinct pickup and dropoff dates observed in active
      canonical rows, plus the key-zero Unknown member. It is not a min/max date spine.
    columns:
      - name: date_key
        description: YYYYMMDD integer for known dates and zero for Unknown.
        data_tests:
          - not_null
          - unique
      - name: full_date
        description: Observed calendar date; null for the Unknown member.
      - name: day_of_week
        description: ISO weekday number from Monday 1 through Sunday 7.
      - name: is_weekend
        description: True for Saturday and Sunday; null for the Unknown member.

  - name: fct_trips
    description: >-
      One analytics-ready active canonical TLC source trip record, including source
      anomalies rather than asserting real-world validity. Normal builds append only
      source_file_ids absent from the target; --full-refresh rebuilds all active rows.
      Pickup and dropoff keys both role-play dim_zone, and unresolved dimension values
      map to explicit key-zero Unknown members.
    columns:
      - name: pickup_zone_key
        description: Pickup role of dim_zone; zero when the source location is unresolved.
      - name: dropoff_zone_key
        description: Dropoff role of dim_zone; zero when the source location is unresolved.
      - name: vendor_key
        description: Vendor dimension key; zero when the source code is unresolved.
      - name: pickup_date_key
        description: Pickup date dimension key; zero when pickup datetime is null.
      - name: dropoff_date_key
        description: Dropoff date dimension key; zero when dropoff datetime is null.
      - name: rate_code_id
        description: Original TLC rate code, preserved even when unmapped.
      - name: rate_code_name
        description: Seed-mapped TLC rate name or Unknown.
      - name: payment_type
        description: Original TLC payment code, preserved even when unmapped.
      - name: payment_type_name
        description: Seed-mapped TLC payment description or Unknown.
      - name: source_file_id
        description: Immutable source-file version and incremental boundary.
        data_tests:
          - not_null
      - name: source_row_number
        description: Deterministic row position within the source file.
        data_tests:
          - not_null
      - name: pipeline_run_id
        description: Ingestion run responsible for the source row.
        data_tests:
          - not_null
