name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  POSTGRES_DB: nyc_tlc_test
  POSTGRES_USER: nyc_tlc_test
  POSTGRES_PASSWORD: nyc_tlc_test
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql+psycopg://nyc_tlc_test:nyc_tlc_test@localhost:5432/nyc_tlc_test
  TEST_DATABASE_URL: postgresql+psycopg://nyc_tlc_test:nyc_tlc_test@localhost:5432/nyc_tlc_test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Validate Docker Compose
        env:
          AIRFLOW_FERNET_KEY: test-only-fernet-key
          AIRFLOW_JWT_SECRET: test-only-jwt-secret
          AIRFLOW_ADMIN_PASSWORD: test-only-admin-password
        run: docker compose config --quiet

  python-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nyc_tlc_test
          POSTGRES_USER: nyc_tlc_test
          POSTGRES_PASSWORD: nyc_tlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyc_tlc_test -d nyc_tlc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest tests/unit tests/integration

  dbt-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nyc_tlc_test
          POSTGRES_USER: nyc_tlc_test
          POSTGRES_PASSWORD: nyc_tlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyc_tlc_test -d nyc_tlc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m dbt.cli.main debug --project-dir dbt/taxi_analytics --profiles-dir dbt/taxi_analytics
      - run: python -m dbt.cli.main parse --project-dir dbt/taxi_analytics --profiles-dir dbt/taxi_analytics
      - run: python -m dbt.cli.main seed --project-dir dbt/taxi_analytics --profiles-dir dbt/taxi_analytics
      - run: python -m pytest tests/e2e

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow and project
        run: |
          python -m pip install "apache-airflow==3.3.1" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.13.txt"
          python -m pip install -e ".[dev]"
      - run: python -m pytest tests/dag
