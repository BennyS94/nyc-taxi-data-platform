[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-tlc-data-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "dbt-core>=1.9,<2",
    "dbt-postgres>=1.9,<2",
    "fastapi>=0.115,<1",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=19,<24",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py311"
